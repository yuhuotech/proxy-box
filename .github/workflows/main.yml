name: ProxyBox checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proxy-box-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:tools
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir backend test
      - run: pnpm --dir frontend check:locales
      - run: pnpm --dir backend bundle:esbuild
      - run: pnpm --dir frontend build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser QA on disposable merged server
        run: |
          mkdir -p "$RUNNER_TEMP/proxy-box-qa"
          SUB_STORE_DATA_BASE_PATH="$RUNNER_TEMP/proxy-box-qa" \
          SUB_STORE_BACKEND_API_HOST=127.0.0.1 \
          SUB_STORE_BACKEND_API_PORT=39125 \
          SUB_STORE_BACKEND_MERGE=true \
          SUB_STORE_FRONTEND_BACKEND_PATH=/backend \
          SUB_STORE_FRONTEND_PATH="$PWD/frontend/dist" \
          SUB_STORE_CORS_ALLOWED_ORIGINS=http://127.0.0.1:39125 \
          node backend/sub-store.min.js > "$RUNNER_TEMP/proxy-box-qa.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:39125/backend/api/utils/env > /dev/null; then break; fi
            sleep 1
          done
          PROXY_BOX_QA_DISPOSABLE=1 PROXY_BOX_QA_BASE_URL=http://127.0.0.1:39125 pnpm test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-box-${{ github.sha }}
          path: |
            frontend/dist/
            backend/sub-store.min.js
            backend/dist/
            LICENSE
            frontend/LICENSE
            NOTICE.md
            artifacts/ui/
          retention-days: 14
